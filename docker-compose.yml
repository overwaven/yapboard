services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hubbub
      POSTGRES_PASSWORD: hubbub
      POSTGRES_DB: hubbub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubbub -d hubbub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      # Overrides the .env value so the container talks to the compose service.
      DATABASE_URL: postgresql://hubbub:hubbub@db:5432/hubbub
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
